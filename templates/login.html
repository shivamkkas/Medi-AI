<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup - MediAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .auth-gradient {
            background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%);
        }

        .form-input:focus {
            border-color: #2575fc;
            box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.2);
        }

        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 3px solid #2575fc;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="container max-w-5xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden grid md:grid-cols-2">
            <!-- Left Side - Info -->
            <div class="hidden md:block auth-gradient p-12 text-white relative">
                <div class="relative z-10">
                    <h2 class="text-4xl font-bold mb-6">Welcome Back</h2>
                    <p class="text-lg mb-8">Access your MediAI account to continue your healthcare journey.</p>
                    <div class="space-y-4">
                        <div class="flex items-center">
                            <i class="fas fa-shield-alt mr-4"></i>
                            <span>HIPAA Compliant</span>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-lock mr-4"></i>
                            <span>Secure Authentication</span>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-user-md mr-4"></i>
                            <span>Professional Healthcare Network</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Forms -->
            <div class="p-8 md:p-12">
                <!-- Alerts -->
                <div id="alertBox" class="mb-6 hidden">
                    <div class="p-4 rounded-lg"></div>
                </div>

                <!-- Form Toggle -->
                <div class="flex mb-8 border-b">
                    <button id="loginTab"
                        class="flex-1 pb-4 text-center font-semibold border-b-2 border-blue-500 text-blue-600">Login</button>
                    <button id="signupTab" class="flex-1 pb-4 text-center font-semibold text-gray-500">Sign Up</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-gray-700 mb-2">Email/Username</label>
                        <input type="text" name="username" required
                            class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:outline-none transition-colors"
                            placeholder="Enter your email or username">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <input type="password" name="password" required
                                class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:outline-none transition-colors"
                                placeholder="Enter your password">
                            <button type="button"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex justify-between items-center">
                        <label class="flex items-center">
                            <input type="checkbox" name="remember" class="mr-2">
                            <span class="text-sm text-gray-600">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center">
                        <span>Login</span>
                        <div class="spinner ml-2"></div>
                    </button>
                </form>

                <!-- Signup Form -->
                <form id="signupForm" class="space-y-6 hidden">
                    <div>
                        <label class="block text-gray-700 mb-2">Username</label>
                        <input type="text" name="username" required
                            class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:outline-none transition-colors"
                            placeholder="Choose a username">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">Email Address</label>
                        <input type="email" name="email" required
                            class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:outline-none transition-colors"
                            placeholder="Enter your email">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <input type="password" name="password" required
                                class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:outline-none transition-colors"
                                placeholder="Create a strong password">
                            <button type="button"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">Confirm Password</label>
                        <div class="relative">
                            <input type="password" name="confirmPassword" required
                                class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:outline-none transition-colors"
                                placeholder="Confirm your password">
                            <button type="button"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="flex items-center">
                            <input type="checkbox" name="terms" required class="mr-2">
                            <span class="text-sm text-gray-600">I agree to the <a href="#"
                                    class="text-blue-600 hover:underline">Terms of Service</a></span>
                        </label>
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center">
                        <span>Create Account</span>
                        <div class="spinner ml-2"></div>
                    </button>
                </form>

                <!-- Social Login -->
                <div class="mt-8">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">Or continue with</span>
                        </div>
                    </div>
                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <button type="button"
                            class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                            <i class="fab fa-google text-red-600 mr-2"></i>
                            Google
                        </button>
                        <button type="button"
                            class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                            <i class="fab fa-facebook-f text-blue-600 mr-2"></i>
                            Facebook
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Form toggle functionality
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const alertBox = document.getElementById('alertBox');

        function showAlert(type, message) {
            const alertDiv = alertBox.querySelector('div');
            alertBox.classList.remove('hidden');
            alertDiv.className = 'p-4 rounded-lg ' +
                (type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700');
            alertDiv.textContent = message;

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 5000);
        }

        function showSpinner(form) {
            const spinner = form.querySelector('.spinner');
            const submitText = form.querySelector('button[type="submit"] span');
            spinner.style.display = 'block';
            submitText.style.opacity = '0.7';
        }

        function hideSpinner(form) {
            const spinner = form.querySelector('.spinner');
            const submitText = form.querySelector('button[type="submit"] span');
            spinner.style.display = 'none';
            submitText.style.opacity = '1';
        }

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('border-b-2', 'border-blue-500', 'text-blue-600');
            loginTab.classList.remove('text-gray-500');
            signupTab.classList.remove('border-b-2', 'border-blue-500', 'text-blue-600');
            signupTab.classList.add('text-gray-500');
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            alertBox.classList.add('hidden');
        });

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('border-b-2', 'border-blue-500', 'text-blue-600');
            signupTab.classList.remove('text-gray-500');
            loginTab.classList.remove('border-b-2', 'border-blue-500', 'text-blue-600');
            loginTab.classList.add('text-gray-500');
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            alertBox.classList.add('hidden');
        });

        // Password visibility toggle
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', () => {
                const input = button.previousElementSibling;
                const icon = button.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });

        // Login form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showSpinner(loginForm);

            const formData = new FormData(loginForm);
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password')
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    showAlert('success', 'Login successful! Redirecting...');
                    localStorage.setItem('authToken', data.token);
                    setTimeout(() => {
                        window.location.href = '/userprofile';
                    }, 10);
                } else {
                    showAlert('error', data.message || 'Login failed. Please try again.');
                }
            } catch (error) {
                showAlert('error', 'An error occurred. Please try again.');
                console.error('Login error:', error);
            } finally {
                hideSpinner(loginForm);
            }
        });

        // Signup form submission
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(signupForm);

            if (formData.get('password') !== formData.get('confirmPassword')) {
                showAlert('error', 'Passwords do not match');
                return;
            }

            showSpinner(signupForm);

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: formData.get('username'),
                        email: formData.get('email'),
                        password: formData.get('password')
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    console.log(data)
                    showAlert('success', 'Account created successfully! Please log in.');
                    signupForm.reset();
                    setTimeout(() => {
                        loginTab.click();
                    }, 1500);
                } else {
                    showAlert('error', data.message || 'Signup failed. Please try again.');
                }
            } catch (error) {
                showAlert('error', 'An error occurred.Please try again.');
                console.error('Signup error:', error);
            } finally {
                hideSpinner(signupForm);
            }
        });

        // Form validation
        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validatePassword(password) {
            return password.length >= 8;
        }

        // Email validation
        document.querySelectorAll('input[type="email"]').forEach(input => {
            input.addEventListener('blur', () => {
                if (!validateEmail(input.value) && input.value !== '') {
                    input.classList.add('border-red-500');
                    showAlert('error', 'Please enter a valid email address');
                } else {
                    input.classList.remove('border-red-500');
                }
            });
        });

        // Password validation
        signupForm.querySelector('input[name="password"]').addEventListener('blur', function () {
            if (!validatePassword(this.value) && this.value !== '') {
                this.classList.add('border-red-500');
                showAlert('error', 'Password must be at least 8 characters long');
            } else {
                this.classList.remove('border-red-500');
            }
        });

        // Confirm password validation
        signupForm.querySelector('input[name="confirmPassword"]').addEventListener('blur', function () {
            const password = signupForm.querySelector('input[name="password"]').value;
            if (this.value !== password && this.value !== '') {
                this.classList.add('border-red-500');
                showAlert('error', 'Passwords do not match');
            } else {
                this.classList.remove('border-red-500');
            }
        });

        // Remember me functionality
        const rememberCheckbox = loginForm.querySelector('input[name="remember"]');
        const usernameInput = loginForm.querySelector('input[name="username"]');

        rememberCheckbox.addEventListener('change', () => {
            if (rememberCheckbox.checked) {
                localStorage.setItem('rememberedUsername', usernameInput.value);
            } else {
                localStorage.removeItem('rememberedUsername');
            }
        });

        // Load remembered username
        window.addEventListener('load', () => {
            const rememberedUsername = localStorage.getItem('rememberedUsername');
            if (rememberedUsername) {
                usernameInput.value = rememberedUsername;
                rememberCheckbox.checked = true;
            }
        });

        // Social login handlers
        document.querySelector('button:has(.fa-google)').addEventListener('click', () => {
            showAlert('error', 'Google login is not implemented yet');
        });

        document.querySelector('button:has(.fa-facebook-f)').addEventListener('click', () => {
            showAlert('error', 'Facebook login is not implemented yet');
        });

        // Clear form data on tab switch
        loginTab.addEventListener('click', () => {
            loginForm.reset();
            alertBox.classList.add('hidden');
        });

        signupTab.addEventListener('click', () => {
            signupForm.reset();
            alertBox.classList.add('hidden');
        });
    </script>
</body>

</html>
